name: Release

# 触发方式
#   1. 推送版本更新：main 分支上 VERSION 文件被改动 → 自动打 tag 并发布 Release
#   2. 手动推 v* 标签：直接发布该标签（保留原有用法）
#   3. Actions 页面手动触发（workflow_dispatch）：按当前 VERSION 补发
#
# 为什么「打 tag」与「发 Release」必须写在同一个 workflow 里
#   GitHub 有一条硬规则：用仓库自带的 GITHUB_TOKEN 推送 tag，**不会**触发其他
#   workflow（防止递归触发）。所以「workflow A 打 tag → workflow B 监听 v* 发版」
#   这种拆法永远不会生效——B 一次都不会跑。必须自包含。
#   代价：本文件同时承担「打 tag」与「发版」两件事，改的时候别拆开。

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      # 路径过滤只作用于分支推送，对 tag 推送不生效（GitHub 明确行为）。
      # 因此推 v* 标签照样能触发，而 main 上只有动了 VERSION 才触发。
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 只允许一个发布任务在跑，避免并发重复打 tag
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 打 tag 并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------
      # 版本号解析：VERSION 是唯一事实来源
      # ---------------------------------------------------------------
      - name: 解析并校验版本号
        id: ver
        run: |
          set -e
          V="$(tr -d ' \t\r\n' < VERSION)"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION 内容不是合法的语义化版本：'$V'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "→ 版本 $V，标签 v$V"

      - name: 校验 CHANGELOG 已记录该版本
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          if ! grep -qE "^## \[$V\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里找不到 '## [$V]' 段落；先把 [Unreleased] 的内容归到该版本号下再发版"
            exit 1
          fi
          echo "OK：CHANGELOG 已包含 [$V]"

      - name: 校验标签与 VERSION 一致（tag 触发时）
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -e
          T="${GITHUB_REF_NAME#v}"
          V="${{ steps.ver.outputs.version }}"
          if [ "$T" != "$V" ]; then
            echo "::error::标签($T) 与 VERSION($V) 不一致，请同步后再发版"
            exit 1
          fi
          echo "OK：标签与 VERSION 一致"

      # ---------------------------------------------------------------
      # 先自检 + 打包，都过了才动 tag —— 避免留下指向坏提交的 tag
      # ---------------------------------------------------------------
      - name: 发布前自检（必须全绿）
        run: python scripts/validate_skill.py

      - name: 生成分发包
        run: python scripts/build_zip.py

      # ---------------------------------------------------------------
      # Release 说明直接取 CHANGELOG 里对应版本的段落。
      # 不用 action 自带的 generate_release_notes：它只按「合并的 PR」生成，
      # 本仓库是直推 main、不走 PR，生成出来只有一行 Full Changelog，等于没有说明。
      # ---------------------------------------------------------------
      - name: 生成 Release 说明（取自 CHANGELOG 对应段落）
        run: |
          set -e
          python - "${{ steps.ver.outputs.version }}" "${{ github.repository }}" <<'PY'
          import pathlib, re, subprocess, sys

          ver, repo = sys.argv[1], sys.argv[2]
          tag = f"v{ver}"

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.S | re.M)
          if not m:
              sys.exit(f"CHANGELOG.md 里找不到 [{ver}] 段落")
          body = m.group(1).strip()

          # 上一版标签：排序列出全部 tag，剔除当前版本后取最高那个。
          # 不依赖当前 tag 已经存在（生成说明时 tag 还没建）。
          subprocess.run(["git", "fetch", "--tags", "--force", "--quiet", "origin"],
                         capture_output=True)
          tags = subprocess.run(["git", "tag", "-l", "v*", "--sort=-v:refname"],
                                capture_output=True, text=True).stdout.split()
          others = [t for t in tags if t != tag]
          prev = others[0] if others else None

          if prev:
              body += (f"\n\n---\n\n**完整变更对比**："
                       f"https://github.com/{repo}/compare/{prev}...{tag}\n")

          pathlib.Path("release_notes.md").write_text(body, encoding="utf-8")
          print(f"已生成 release_notes.md：{len(body)} 字符，上一版 {prev or '（无）'}")
          PY

      - name: 自动打 tag（分支推送时；标签已存在则跳过）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "标签 $TAG 已存在于远端，跳过创建"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "已创建并推送标签 $TAG"
          fi

      - name: 创建 Release 并附加 zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          files: dist/*.zip
          draft: false
          prerelease: false
          make_latest: true
