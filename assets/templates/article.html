<!--
  公众号正文模板（可直接改成你的文章）
  硬性约束，改的时候别破坏：
  1. 全部用内联样式 —— <style> 块和 class 会被公众号编辑器剥离
  2. 图片写本地相对路径（相对 config.json 所在目录），脚本会自动上传到微信图床并替换 src
     正确：src="assets/diagram.png"      错误：src="https://..."（外链会被静默过滤）
  3. 不要写 JS、iframe、表单元素
  4. 字段上限：标题 32 字 / 作者 16 字 / 摘要 120 字 / 正文 2 万字符
-->

<section style="font-size:16px;line-height:1.8;color:#3f3f3f;letter-spacing:0.4px;word-wrap:break-word;">

  <p style="margin:0 0 18px;">【开篇】一两句话交代这篇要讲什么。段落用 &lt;p style="margin:0 0 18px;"&gt;，靠 margin 控制段间距，不要用空段落充数。</p>

  <p style="margin:0 0 18px;">强调用 <strong style="color:#d94f22;">strong 加主题色</strong>，正文里不要滥用。</p>

  <section style="margin:0 0 22px;padding:16px 18px;background:#faf7f4;border-left:3px solid #d94f22;border-radius:2px;">
    <p style="margin:0 0 8px;"><strong>要点一</strong> —— 补充说明。</p>
    <p style="margin:0 0 8px;"><strong>要点二</strong> —— 补充说明。</p>
    <p style="margin:0;"><strong>要点三</strong> —— 补充说明。</p>
  </section>

  <p style="margin:0 0 14px;font-size:16px;font-weight:bold;color:#222;">小标题</p>

  <p style="margin:0 0 16px;">正文段落。手机阅读建议每段不超过 3 行，长内容拆段。</p>

  <table style="width:100%;border-collapse:collapse;font-size:14px;margin:0 0 24px;">
    <thead>
      <tr>
        <th style="padding:9px 10px;background:#333;color:#fff;text-align:left;font-weight:normal;">列一</th>
        <th style="padding:9px 10px;background:#333;color:#fff;text-align:left;font-weight:normal;">列二</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="padding:9px 10px;border-bottom:1px solid #eee;">内容</td>
        <td style="padding:9px 10px;border-bottom:1px solid #eee;">内容</td>
      </tr>
      <tr>
        <td style="padding:9px 10px;border-bottom:1px solid #eee;background:#fcfcfc;">隔行浅底</td>
        <td style="padding:9px 10px;border-bottom:1px solid #eee;background:#fcfcfc;">隔行浅底</td>
      </tr>
    </tbody>
  </table>

  <p style="margin:0 0 12px;">图注或说明文字。</p>
  <p style="margin:0 0 24px;"><img src="assets/diagram.png" style="width:100%;display:block;border-radius:3px;" alt="图片说明"></p>

  <section style="margin:0 0 24px;padding:2px 0 2px 14px;border-left:2px solid #ddd;color:#777;font-size:15px;">
    引用内容。
  </section>

  <p style="margin:0;">收尾段落。</p>

  <p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #eee;font-size:13px;color:#999;text-align:center;">页脚 / 署名 / 分割线</p>

</section>
